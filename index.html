<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 숙제 고민 상담소</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', '맑은 고딕', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, textarea:focus {
            border-color: #4A90E2;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        button {
            width: 100%;
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #357ABD;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 12px;
            border-left: 5px solid #4A90E2;
            text-align: left;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-box h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-content {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">📚</div>
    <h1>AI 숙제 고민 상담소</h1>
    <p class="subtitle">"숙제가 너무 많거나 미루게 되나요?"<br>고민을 나누면 맞춤형 해결책을 알려드려요!</p>

    <div class="input-group">
        <label for="reason">가장 큰 이유가 무엇인가요?</label>
        <select id="reason">
            <option value="time">시간이 부족해서 (학원/다른 일정)</option>
            <option value="lazy">자꾸 미루고 스마트폰/게임만 하게 돼서</option>
            <option value="hard">내용이 너무 어려워서 이해가 안 돼서</option>
            <option value="amount">숙제 양이 너무 많아서 엄두가 안 나서</option>
        </select>
    </div>

    <div class="input-group">
        <label for="details">자세한 상황을 적어주세요 (선택)</label>
        <textarea id="details" placeholder="예: 수학 숙제가 너무 어려운데 저녁 10시에 시작해서 결국 다 못했어요."></textarea>
    </div>

    <button onclick="getAdvice()">상담 받기 💡</button>

    <div id="result" class="result-box">
        <h3>🤖 AI 처방전</h3>
        <div id="adviceText" class="result-content"></div>
    </div>
</div>

<script>
    function getAdvice() {
        const reason = document.getElementById('reason').value;
        const details = document.getElementById('details').value;
        const resultBox = document.getElementById('result');
        const adviceText = document.getElementById('adviceText');

        // 처리 중 효과
        adviceText.innerHTML = "AI가 해결책을 생각하고 있어요... 💭";
        resultBox.style.display = "block";

        setTimeout(() => {
            let advice = "";

            // 이유에 따른 맞춤 상담 로직
            if (reason === "time") {
                advice = "⏱️ **[시간 부족형 맞춤 솔루션]**\n\n" +
                         "1. **'쪼개서 하기' 기술**: 학원 가기 전 10분, 저녁 먹고 15분처럼 자투리 시간을 활용해보세요.\n" +
                         "2. **우선순위 정하기**: 가장 빨리 끝낼 수 있는 숙제부터 해결해서 성취감을 느껴보세요.\n" +
                         "3. **선생님께 솔직하게 솔루션 요청하기**: 정말 시간이 부족하다면, 미리 선생님께 말씀드리고 분량을 조율하는 것도 용기입니다!";
            } else if (reason === "lazy") {
                advice = "📱 **[미루기 극복 맞춤 솔루션]**\n\n" +
                         "1. **'5분만 법칙'**: '딱 5분만 앉아서 적어보자'라고 생각하고 시작해보세요. 시작이 가장 어렵습니다!\n" +
                         "2. **스마트폰 멀리 치우기**: 숙제하는 동안 휴대폰은 다른 방에 두거나 '타임락' 앱을 활용하세요.\n" +
                         "3. **뽀모도로 기법**: 25분 집중해서 숙제하고, 5분은 마음껏 쉬는 타이머 공부법을 추천해요.";
            } else if (reason === "hard") {
                advice = "💡 **[난이도 극복 맞춤 솔루션]**\n\n" +
                         "1. **아는 것부터 풀어보기**: 모르는 문제에 막혀서 시간을 허비하지 말고, 아는 문제부터 다 끝내세요.\n" +
                         "2. **도움 요청하기**: 혼자 끙끙대지 말고 친구, 부모님, AI, 질문 앱(QANDA 등)을 활용해 힌트를 얻으세요.\n" +
                         "3. **개념 다시 읽기**: 풀리지 않을 때는 문제보다 교과서나 개념집의 설명 부분을 다시 훑어보는 것이 빠릅니다.";
            } else if (reason === "amount") {
                advice = "📦 **[부담감 줄이기 맞춤 솔루션]**\n\n" +
                         "1. **덩어리 나누기**: '숙제 전체'를 보지 말고, '지금은 3페이지까지만'처럼 작은 목표로 나누세요.\n" +
                         "2. **체크리스트 만들기**: 할 일을 목록으로 적고 하나씩 지워나가는 재미를 느껴보세요.\n" +
                         "3. **완벽주의 버리기**: 100점짜리로 다 하려고 하지 말고, 일단 70%라도 끝까지 다 해가는 것을 목표로 삼으세요!";
            }

            if (details.trim() !== "") {
                advice += "\n\n--- \n💬 **추가 조언**: '" + details + "'라고 적어주셨네요. 너무 스트레스받지 말고, 오늘 할 수 있는 작은 분량부터 하나씩 시작해봐요! 화이팅!";
            }

            adviceText.innerText = advice;
        }, 600); // 0.6초 뒤에 상담 결과 출력
    }
</script>

</body>
</html>
